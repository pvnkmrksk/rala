name = "rala-search"
main = "src/index.js"
compatibility_date = "2024-01-01"

# KV Namespace binding
[[kv_namespaces]]
binding = "DICTIONARY"
id = "3c0a155119644621bd656231b4ec9063"

# Analytics Engine (optional). Cloudflare still returns code 10089 on this account.
# After enabling AE in dashboard, uncomment and deploy again:
# [[analytics_engine_datasets]]
# binding = "ANALYTICS_ENGINE"
# dataset = "analytic_events"

# R2 archive for durable event storage (optional). Enable R2 in dashboard first:
# https://dash.cloudflare.com/<account_id>/r2
[[r2_buckets]]
binding = "LOG_ARCHIVE"
bucket_name = "rala-event-archive"

# Set with:
# npx wrangler secret put LOG_DASHBOARD_TOKEN
# Used by GET /__rala/v1/archive for local dashboard access.

[observability]
enabled = false
head_sampling_rate = 1

[observability.logs]
enabled = true
head_sampling_rate = 1
persist = true
invocation_logs = false

[observability.traces]
enabled = false
persist = true
head_sampling_rate = 1

# Note: CPU limits are not available on Free plan
# [limits]
# cpu_ms = 50

